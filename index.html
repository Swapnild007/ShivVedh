"लोकप्रिय कथा, लोकस्मृती आणि दस्तऐवजांनी पुष्टी केलेली घटना या एकाच गोष्टी नाहीत. या भेदाचे भान वाचकापर्यंत पोहोचवणे हे या उपक्रमाचे प्रमुख उद्दिष्ट आहे."
],note:"हे संपादकीय मनोगत आहे; ऐतिहासिक पुरावा नाही."},
{title:"प्रस्तावना",kind:"प्रारंभिक पृष्ठ",paragraphs:[
"छत्रपती शिवाजी महाराजांचा इतिहास समजून घेण्यासाठी सतराव्या शतकातील दख्खनचा राजकीय आणि भौगोलिक संदर्भ समजणे आवश्यक आहे. तत्कालीन सत्ताकेंद्रे, व्यापारमार्ग, स्थानिक प्रशासन आणि दुर्गव्यवस्था या घटकांचा घटनांशी जवळचा संबंध होता.",
"एखाद्या प्रसंगाचे वर्णन करताना त्याची कालमर्यादा, वापरलेले साधन आणि त्या साधनाचा लेखक किंवा निर्मितीचा संदर्भ लक्षात घेणे आवश्यक असते.",
"या ग्रंथात शक्य तेथे मूळ दस्तऐवज, त्यांची संपादित प्रकाशने आणि विविध इतिहासकारांची मते स्वतंत्रपणे नोंदवण्याचे धोरण आहे."
],note:"हा प्राथमिक परिचय आहे. सविस्तर ऐतिहासिक प्रकरणे अद्याप प्रकाशित झालेली नाहीत."},
{title:"इतिहासाची साधने",kind:"अभ्यास विभाग",paragraphs:[
"समकालीन पत्रव्यवहार, प्रशासकीय दप्तर, फारसी आणि मराठी कागदपत्रे, शिलालेख, नाणी तसेच परकीय प्रवाशांच्या नोंदी ही इतिहासाच्या अभ्यासातील विविध प्रकारची साधने आहेत.",
"प्रत्येक साधनाचे स्वरूप वेगळे असते. एखादे पत्र तत्कालीन निर्णयाचा पुरावा देऊ शकते; परंतु त्यातून त्या निर्णयामागील प्रत्येक हेतू निश्चितपणे समजतोच असे नाही.",
"बखरींचे वाचन करताना त्यांचा रचनाकाळ, उपलब्ध हस्तलिखित प्रती, लेखकाचा दृष्टिकोन आणि नंतरच्या काळातील बदल तपासणे आवश्यक असते.",
"स्वतंत्र साधनांमधील पुष्टी महत्त्वाची असते. एका मूळ मजकुरावर आधारित अनेक नंतरची पुस्तके स्वतंत्र पुरावे ठरत नाहीत."
],note:"साधनचिकित्सेचा प्राथमिक परिचय. विशिष्ट घटनांसाठी पृष्ठनिहाय संदर्भ पुढील संशोधनानंतर जोडले जातील."},
{title:"संपादकीय व संदर्भ धोरण",kind:"संशोधन नोंद",paragraphs:[
"शिववेधमध्ये ऐतिहासिक विधानासाठी शक्य असल्यास साधनाचे नाव, लेखक किंवा संपादक, प्रकाशनवर्ष, आवृत्ती, संबंधित पृष्ठ आणि दस्तऐवजाचा कालावधी नोंदवला जाईल.",
"स्रोतांमध्ये मतभेद असतील तर एकच निष्कर्ष निश्चित असल्याचा आभास निर्माण केला जाणार नाही. उपलब्ध पुरावे आणि उरलेल्या अनिश्चितता स्पष्टपणे मांडल्या जातील.",
"कथन अधिक वाचनीय करण्यासाठी साहित्यिक भाषा वापरली जाऊ शकते; मात्र कल्पित संवाद, दृश्ये किंवा मनोगते ऐतिहासिक तथ्य म्हणून सादर केली जाणार नाहीत.",
"कालरेषा, व्यक्तिचित्रे, किल्ल्यांचा इतिहास आणि संदर्भग्रंथसूची हे विभाग पुरेशी स्रोतपडताळणी झाल्यावरच प्रकाशित केले जातील."
],note:"अद्याप पूर्ण ऐतिहासिक प्रकरणे तयार नाहीत. ही पारदर्शक संपादकीय नोंद आहे."}
];
const $=id=>document.getElementById(id);const screens=["landing","history"];function show(id){for(const s of screens)$(s).hidden=s!==id;window.scrollTo(0,0)}$("enter").onclick=()=>{index=0;show("history");render()};$("history-back").onclick=()=>show("landing");
const stateKey="shivvedh-history-v4";let index=0,mark=-1,size=18;try{const v=JSON.parse(localStorage.getItem(stateKey)||"{}");if(Number.isInteger(v.index)&&v.index>=0&&v.index<bookPages.length)index=v.index;if(Number.isInteger(v.mark))mark=v.mark;if(Number.isInteger(v.size)&&v.size>=16&&v.size<=25)size=v.size}catch(e){}function save(){try{localStorage.setItem(stateKey,JSON.stringify({index,mark,size}))}catch(e){}}
function node(tag,cls,value){const el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined)el.textContent=value;return el}
function render(){const page=bookPages[index],root=$("page");root.replaceChildren();if(page.portrait){root.append(node("div","page-kicker","॥ राजचित्र ॥"));const img=node("img","portrait");img.src=page.portrait;img.alt="छत्रपती शिवाजी महाराजांचे कलात्मक चित्रण";root.append(img,node("h2","",page.title),node("p","portrait-label",page.note))}else{root.append(node("div","invocation","॥ श्री गणेशाय नमः ॥"),node("div","page-kicker",page.kind),node("h2","",page.title));for(const paragraph of page.paragraphs)root.append(node("p","prose",paragraph));root.append(node("p","note","संपादकीय नोंद: "+page.note))}root.style.setProperty("--size",size+"px");$("page-count").textContent=(index+1)+" / "+bookPages.length;$("prev").disabled=index===0;$("next").disabled=index===bookPages.length-1;$("bookmark").textContent=mark===index?"★ खूण ठेवली":"☆ खूण ठेवा";save();window.scrollTo(0,0)}
$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(index<bookPages.length-1){index++;render()}};$("bookmark").onclick=()=>{mark=mark===index?-1:index;render()};$("font-minus").onclick=()=>{size=Math.max(16,size-1);render()};$("font-plus").onclick=()=>{size=Math.min(25,size+1);render()};
function tocRender(){const q=$("toc-search").value.trim().toLocaleLowerCase("mr");$("toc-list").replaceChildren();bookPages.forEach((p,i)=>{if(!(p.title+" "+p.kind).toLocaleLowerCase("mr").includes(q))return;const b=node("button","",p.title);b.append(node("small","",p.kind));b.onclick=()=>{index=i;$("toc").hidden=true;render()};$("toc-list").append(b)})}
$("toc-open").onclick=()=>{$("toc").hidden=false;tocRender();$("toc-close").focus()};$("toc-close").onclick=()=>{$("toc").hidden=true;$("toc-open").focus()};$("toc-search").oninput=tocRender;$("toc").onclick=e=>{if(e.target===$("toc"))$("toc").hidden=true};document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("toc").hidden)$("toc").hidden=true});
</script></body></html>

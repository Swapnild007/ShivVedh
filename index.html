<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#efe4c8"><title>शिववेध | डिजिटल ग्रंथ</title><style>
:root{--ink:#37281e;--gold:#986a32;--paper:#f4e9cf}*{box-sizing:border-box}body{margin:0;background:#d9c8a4;color:var(--ink);font-family:Georgia,'Noto Serif Devanagari',serif}.shell{max-width:1120px;margin:auto;padding:28px}.mast{text-align:center;padding:25px 0;border-bottom:1px solid #bca77f}.mast small{letter-spacing:.25em;color:#785a38}.mast h1{font-size:clamp(3rem,9vw,6rem);margin:10px;color:#743d26}.mast p{font-size:1.15rem}.layout{display:grid;grid-template-columns:260px 1fr;gap:22px;margin-top:25px}.index,.page{background:var(--paper);border:1px solid #c5b38f;box-shadow:0 12px 32px #60452224}.index{padding:22px}.index h2{font-size:1.2rem}.index button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #d9c7a7;padding:13px 6px;color:var(--ink);cursor:pointer;font:inherit}.index button[aria-current="page"]{color:#9d4e23;font-weight:bold}.page{min-height:590px;padding:clamp(24px,5vw,72px);position:relative}.page:before{content:"❧";position:absolute;top:20px;right:30px;color:#ad8755;font-size:32px}.kicker{text-align:center;color:#896d4b}.page h2{text-align:center;font-size:clamp(1.8rem,4vw,3rem);margin:25px 0}.rule{text-align:center;color:#aa824a;font-size:30px}.page p{line-height:2;font-size:1.13rem;text-align:justify}.notice{border-left:3px solid #a77c42;padding:14px;background:#e9d9b8;margin-top:25px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.tools button,.tools input{background:#f4e9cf;border:1px solid #a48a62;border-radius:4px;padding:10px;color:var(--ink)}.tools button{cursor:pointer}footer{text-align:center;margin:30px;color:#624b33}@media(max-width:760px){.layout{grid-template-columns:1fr}.index{padding:12px}.index nav{display:flex;overflow:auto;gap:12px}.index button{min-width:180px}.page{min-height:500px}}@media print{.index,.tools,footer{display:none}.layout{display:block}.page{box-shadow:none;border:0}}
</style></head><body><div class="shell"><header class="mast"><small>॥ श्री ॥</small><h1>शिववेध</h1><p>स्वराज्याचा इतिहास · संदर्भाधारित डिजिटल ग्रंथ</p><small>खंड प्रथम · अभ्यास आवृत्ती</small></header><div class="tools"><input id="search" aria-label="अनुक्रमणिका शोधा" placeholder="अध्याय शोधा…"><button id="smaller">अ−</button><button id="larger">अ+</button><button onclick="window.print()">मुद्रण / PDF</button></div><main class="layout"><aside class="index"><h2>अनुक्रमणिका</h2><nav id="toc" aria-label="ग्रंथ अनुक्रमणिका"></nav></aside><article class="page" id="reader" aria-live="polite"></article></main><footer>शिववेध · इतिहासाचा अभ्यास, पुराव्यांचा आदर</footer></div><script>
const chapters=[["प्रस्तावना","शिववेध हा छत्रपती शिवाजी महाराज आणि स्वराज्याच्या इतिहासाच्या अभ्यासासाठी तयार होत असलेला डिजिटल ग्रंथ आहे. या आवृत्तीत ग्रंथवाचनाची रचना उपलब्ध आहे. ऐतिहासिक अध्यायांचे संपूर्ण लेखन आणि मूळ संदर्भ तपासूनच प्रकाशित केले जातील."],["ऐतिहासिक स्रोत","इतिहासाचा अभ्यास करताना समकालीन पत्रव्यवहार, दप्तर, शिलालेख, नाणी, फारसी आणि मराठी कागदपत्रे तसेच नंतरच्या बखरी यांतील फरक ओळखणे आवश्यक आहे. प्रत्येक ऐतिहासिक दाव्यासाठी स्वतंत्र संदर्भ नोंदवला जाईल."],["कालरेषा","घटनांचा कालानुक्रम, वापरलेली दिनदर्शिका आणि स्रोतांतील मतभेद स्पष्ट करून येथे अभ्यासक्रम मांडला जाईल. अद्याप सत्यापित नसलेली घटना निश्चित म्हणून प्रकाशित केली जाणार नाही."],["गड आणि दुर्गव्यवस्था","गडांचे स्थान, स्थापत्य, संरक्षणव्यवस्था आणि ऐतिहासिक भूमिका यांचा संदर्भांसह अभ्यास येथे समाविष्ट होईल."]];for(let i=5;i<=14;i++)chapters.push(["अध्याय "+String(i).padStart(2,"0"),"या अध्यायाचा मूळ मजकूर आणि संदर्भ अद्याप जोडलेले नाहीत. स्रोत पडताळणीनंतरच पूर्ण अध्याय प्रकाशित केला जाईल."]);
const toc=document.getElementById('toc'),reader=document.getElementById('reader');let selected=0,scale=1;
function render(){toc.innerHTML='';chapters.forEach((c,i)=>{if(!c[0].includes(document.getElementById('search').value))return;let b=document.createElement('button');b.textContent=(i+1)+'. '+c[0];b.setAttribute('aria-current',i===selected?'page':'false');b.onclick=()=>{selected=i;render();window.scrollTo({top:0,behavior:'smooth'})};toc.append(b)});reader.innerHTML='';let k=document.createElement('div');k.className='kicker';k.textContent='॥ अध्याय '+(selected+1)+' ॥';let h=document.createElement('h2');h.textContent=chapters[selected][0];let r=document.createElement('div');r.className='rule';r.textContent='❦';let p=document.createElement('p');p.textContent=chapters[selected][1];p.style.fontSize=(1.13*scale)+'rem';let n=document.createElement('div');n.className='notice';n.textContent='संपादकीय सूचना: ही प्रारंभिक ग्रंथरचना आहे. अप्रमाणित तपशील किंवा काल्पनिक संदर्भ येथे समाविष्ट केलेले नाहीत.';reader.append(k,h,r,p,n)}
document.getElementById('search').oninput=render;document.getElementById('larger').onclick=()=>{scale=Math.min(1.6,scale+.1);render()};document.getElementById('smaller').onclick=()=>{scale=Math.max(.8,scale-.1);render()};render();
</script></body></html>

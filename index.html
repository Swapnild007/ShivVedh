acing:.08em;font-size:12px;margin:10px 0 20px}.paper h2{font-size:clamp(29px,7vw,42px);line-height:1.6;color:#54321f;margin:20px 0 8px}.ornament{font-size:34px;margin:0 0 24px}.paper p{font-size:var(--font-size,19px);line-height:2.15;text-align:justify;text-indent:1.8em;hyphens:auto}.paper p:first-letter{font-size:1.65em;color:#8d4d2c;font-weight:800}.editorial{font-size:12px;border-top:1px solid #bd9b6a;padding-top:18px}.bottom{border-top:2px solid #ae8752;background:#302017}.bottom button{font-weight:600}.panel{background:linear-gradient(100deg,#ddc69f,#f5e8cc 8%,#f5e8cc 92%,#d6b88c);border-left:7px solid #765332}.panel h2{color:#593620}.chap{font-size:17px;line-height:1.6} </style></head><body><div class="app"><section class="cover" id="cover"><div><div class="eyebrow">॥ श्री ॥</div><p>इतिहास • संशोधन • स्वराज्य</p></div><div class="official-art"><img src="assets/shivvedh-logo.png.png" alt="शिववेध अधिकृत राजेशाही चिन्ह: भगवे ध्वज, सुवर्ण मुद्रा आणि शिववेध शीर्षक" loading="eager" decoding="async"></div><div><h2>छत्रपती शिवाजी महाराजांच्या<br>इतिहासाचा संदर्भाधारित अभ्यास</h2><button class="primary" id="enter">ग्रंथात प्रवेश करा ❯</button><p class="foot">खंड प्रथम · अभ्यास आवृत्ती</p></div></section><section class="reader" id="reader"><header class="top"><button class="iconbtn" id="menu" aria-label="अनुक्रमणिका उघडा">☰</button><strong>शिववेध</strong><button class="iconbtn" id="home" aria-label="मुखपृष्ठ">⌂</button></header><article class="paper" id="page" aria-live="polite"></article><nav class="bottom" aria-label="वाचन नियंत्रण"><button id="prev">← मागील</button><button id="contents">☷ अनुक्रमणिका</button><button id="next">पुढील →</button></nav></section></div><div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="ग्रंथ अनुक्रमणिका"><div class="panel"><div class="panelhead"><h2>अनुक्रमणिका</h2><button class="iconbtn" id="close" aria-label="बंद करा">✕</button></div><input id="search" placeholder="अध्याय शोधा…" aria-label="अध्याय शोधा"><div id="chapters"></div></div></div><script>
const data=[{title:"प्रस्तावना",body:"शिववेध हा छत्रपती शिवाजी महाराज आणि स्वराज्याच्या इतिहासाचा संदर्भाधारित अभ्यास मांडण्यासाठी विकसित होत असलेला डिजिटल ग्रंथ आहे. इतिहासातील घटना, व्यक्ती, किल्ले आणि तत्कालीन दस्तऐवज यांचे परीक्षण करून वाचकाला पुराव्यांसह माहिती उपलब्ध करून देणे हा या ग्रंथाचा उद्देश आहे.",ready:true},{title:"इतिहासाची साधने",body:"समकालीन पत्रव्यवहार, सरकारी दप्तर, फारसी आणि मराठी कागदपत्रे, शिलालेख, नाणी आणि नंतर लिहिलेल्या बखरी यांचे स्वरूप वेगवेगळे आहे. एखाद्या ऐतिहासिक दाव्याचे मूल्यमापन करताना साधनाचा काळ, लेखक, हेतू आणि इतर स्वतंत्र पुरावे विचारात घेतले पाहिजेत.",ready:true},{title:"स्वराज्याची कालरेषा",body:"या विभागात घटनांची दिनांकवार नोंद, वापरलेली कालगणना आणि स्रोतांतील मतभेद स्पष्ट करून संदर्भित कालरेषा प्रकाशित केली जाईल.",ready:false},{title:"गडकोट आणि दुर्गव्यवस्था",body:"या विभागात गडांचे ऐतिहासिक महत्त्व, भौगोलिक स्थान, स्थापत्य आणि प्रशासन यांचा स्रोताधारित अभ्यास प्रकाशित केला जाईल.",ready:false}];while(data.length<14)data.push({title:"अध्याय "+String(data.length+1).padStart(2,"0"),body:"या अध्यायाचा मूळ ऐतिहासिक मजकूर आणि स्रोतसंदर्भ अद्याप पडताळणीच्या प्रक्रियेत आहेत. अप्रमाणित माहिती प्रकाशित केली जाणार नाही.",ready:false});
const $=id=>document.getElementById(id);let current=0;function show(){let d=data[current];$('page').replaceChildren();let a=document.createElement('div');a.className='chapter-no';a.textContent='॥ अध्याय '+(current+1)+' ॥';let h=document.createElement('h2');h.textContent=d.title;let o=document.createElement('div');o.className='ornament';o.textContent='❦';let p=document.createElement('p');p.textContent=d.body;let note=document.createElement('div');note.className='editorial';note.textContent=d.ready?'संपादकीय नोंद: हा प्रारंभिक परिचय आहे. विस्तृत संदर्भित लेखन अद्याप प्रलंबित आहे.':'संपादकीय नोंद: हा अध्याय अद्याप पूर्ण झालेला नाही.';$('page').append(a,h,o,p,note);$('prev').disabled=current===0;$('next').disabled=current===data.length-1;window.scrollTo(0,0);localStorage.setItem('shivvedh-chapter',current)}function list(){let q=$('search').value.trim();$('chapters').replaceChildren();data.forEach((d,i)=>{if(!d.title.includes(q))return;let b=document.createElement('button');b.className='chap';b.setAttribute('aria-current',i===current?'page':'false');b.textContent=(i+1)+'. '+d.title;let s=document.createElement('span');s.className='status';s.textContent=d.ready?'प्रारंभिक मजकूर':'लेखन प्रलंबित';b.append(s);b.onclick=()=>{current=i;show();closeDrawer()};$('chapters').append(b)})}function openDrawer(){$('drawer').classList.add('open');list();$('close').focus()}function closeDrawer(){$('drawer').classList.remove('open');$('menu').focus()}$('enter').onclick=()=>{$('cover').classList.add('hidden');$('reader').classList.add('active');show()};$('home').onclick=()=>{$('reader').classList.remove('active');$('cover').classList.remove('hidden');window.scrollTo(0,0)};$('menu').onclick=openDrawer;$('contents').onclick=openDrawer;$('close').onclick=closeDrawer;$('drawer').onclick=e=>{if(e.target===$('drawer'))closeDrawer()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('drawer').classList.contains('open'))closeDrawer()});$('search').oninput=list;$('prev').onclick=()=>{if(current>0){current--;show()}};$('next').onclick=()=>{if(current<data.length-1){current++;show()}};try{current=Math.max(0,Math.min(13,Number(localStorage.getItem('shivvedh-chapter'))||0))}catch(e){}

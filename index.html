<script>
"use strict";
const bookPages=[
{title:"छत्रपती शिवाजी महाराज",kind:"चित्रपृष्ठ",portrait:"assets/shivaji-maharaj.webp.webp",paragraphs:[],note:"हे कलात्मक चित्रण आहे. समकालीन ऐतिहासिक चित्र असल्याचा दावा केलेला नाही."},
{title:"शीर्षकपृष्ठ",kind:"प्रारंभिक पृष्ठ",paragraphs:[

],note:"ही संशोधनाधीन आवृत्ती आहे; संपूर्ण संशोधित ग्रंथ अद्याप प्रकाशित झालेला नाही."},
{title:"मनोगत",kind:"प्रारंभिक पृष्ठ",paragraphs:[
"इतिहास म्हणजे फक्त तारखा आणि युद्धांची मालिका नव्हे. पत्रव्यवहार, दप्तरातील नोंदी, शिलालेख, नाणी, प्रवासवर्णने आणि बखरी यांतून भूतकाळाचे अनेक आवाज आपल्यापर्यंत पोहोचतात.",

],note:"हे संपादकीय मनोगत आहे; ऐतिहासिक पुरावा नाही."},
{title:"प्रस्तावना",kind:"प्रारंभिक पृष्ठ",paragraphs:[

],note:"साधनचिकित्सेचा प्राथमिक परिचय. विशिष्ट घटनांसाठी पृष्ठनिहाय संदर्भ पुढील संशोधनानंतर जोडले जातील."},

let current=0,fontSize=18,bookmark=null,lastFocus=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||"{}");if(Number.isInteger(saved.current)&&saved.current>=0&&saved.current<bookPages.length)current=saved.current;if(Number.isInteger(saved.fontSize)&&saved.fontSize>=16&&saved.fontSize<=24)fontSize=saved.fontSize;if(Number.isInteger(saved.bookmark)&&saved.bookmark>=0&&saved.bookmark<bookPages.length)bookmark=saved.bookmark}catch(error){}

function render(){
 const page=bookPages[current],leaf=$("leaf");leaf.replaceChildren();
 leaf.classList.toggle("portrait-leaf",Boolean(page.portrait));if(page.portrait){const kicker=document.createElement("p");kicker.className="portrait-title";kicker.textContent="॥ शिववेध · राजचित्र ॥";const img=document.createElement("img");img.className="portrait-image";img.src=page.portrait;img.alt="छत्रपती शिवाजी महाराज यांचे कलात्मक चित्रण";img.loading="eager";img.decoding="async";const caption=document.createElement("h2");caption.className="portrait-caption";caption.textContent=page.title;const note=document.createElement("p");note.className="portrait-note";note.textContent=page.note;leaf.append(kicker,img,caption,note);$("page-indicator").textContent=(current+1)+" / "+bookPages.length;$("previous").disabled=current===0;$("following").disabled=current===bookPages.length-1;$("bookmark").textContent=bookmark===current?"★ खूण ठेवली":"☆ खूण ठेवा";persist();window.scrollTo(0,0);return;}const invocation=document.createElement("div");invocation.className="invocation";invocation.textContent="॥ श्री गणेशाय नमः ॥";const folio=document.createElement("div");folio.className="folio";folio.textContent="॥ "+page.kind+" · "+String(current+1).padStart(2,"0")+" ॥";
 const heading=document.createElement("h2");heading.textContent=page.title;
 const flourish=document.createElement("div");flourish.className="flourish";flourish.setAttribute("aria-hidden","true");flourish.textContent="◆  ◇  ◆";
 const prose=document.createElement("div");prose.className="prose";
 for(const line of page.paragraphs){const paragraph=document.createElement("p");paragraph.textContent=line;prose.append(paragraph)}
 const note=document.createElement("div");note.className="editorial";note.textContent="संपादकीय नोंद : "+page.note;
 const footer=document.createElement("div");footer.className="leaf-footer";footer.textContent="शिववेध  •  "+String(current+1).padStart(2,"0");
 leaf.append(invocation,folio,heading,flourish,prose,note,footer);
 $("page-indicator").textContent=(current+1)+" / "+bookPages.length;
 $("previous").disabled=current===0;$("following").disabled=current===bookPages.length-1;
 $("bookmark").textContent=bookmark===current?"★ खूण ठेवली":"☆ खूण ठेवा";
 document.documentElement.style.setProperty("--body-size",fontSize+"px");
 persist();window.scrollTo(0,0);
}
function openBook(){$("cover").hidden=true;$("reader").hidden=false;render()}
function showCover(){$("reader").hidden=true;$("cover").hidden=false;window.scrollTo(0,0)}
function renderToc(){
 const q=$("search").value.trim().toLocaleLowerCase("mr");$("toc-items").replaceChildren();let matches=0;
 bookPages.forEach((page,index)=>{
 if(!(page.title+" "+page.kind).toLocaleLowerCase("mr").includes(q))return;matches++;
 const button=document.createElement("button");button.className="toc-item";button.setAttribute("aria-current",index===current?"page":"false");
 const num=document.createElement("span");num.className="toc-num";num.textContent=String(index+1).padStart(2,"0");
 const label=document.createElement("span");label.className="toc-title";label.textContent=page.title;
 const small=document.createElement("small");small.textContent=page.kind+(bookmark===index?" · खूण ठेवलेले":"");label.append(small);
 button.append(num,label);button.addEventListener("click",()=>{current=index;closeToc();openBook()});$("toc-items").append(button);
 });
 if(!matches){const empty=document.createElement("p");empty.className="empty";empty.textContent="या शोधासाठी पान सापडले नाही.";$("toc-items").append(empty)}
}
function openToc(){lastFocus=document.activeElement;$("drawer").hidden=false;renderToc();$("toc-close").focus()}
function closeToc(){$("drawer").hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$("enter").addEventListener("click",openBook);
$("go-cover").addEventListener("click",showCover);
$("toc-open").addEventListener("click",openToc);
$("toc-bottom").addEventListener("click",openToc);
$("toc-close").addEventListener("click",closeToc);
$("drawer").addEventListener("click",event=>{if(event.target===$("drawer"))closeToc()});
$("search").addEventListener("input",renderToc);
$("previous").addEventListener("click",()=>{if(current>0){current--;render()}});
$("following").addEventListener("click",()=>{if(current<bookPages.length-1){current++;render()}});
$("bookmark").addEventListener("click",()=>{bookmark=bookmark===current?null:current;render()});
$("smaller").addEventListener("click",()=>{fontSize=Math.max(16,fontSize-1);render()});
$("larger").addEventListener("click",()=>{fontSize=Math.min(24,fontSize+1);render()});
document.addEventListener("keydown",event=>{
 if(!$("drawer").hidden){if(event.key==="Escape")closeToc();if(event.key==="Tab"){const focusables=Array.from($("drawer").querySelectorAll("button,input")).filter(el=>!el.disabled);const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}return}
 if($("reader").hidden)return;
 if(event.key==="ArrowLeft"&&current>0){current--;render()}
 if(event.key==="ArrowRight"&&current<bookPages.length-1){current++;render()}
});
</script>
</body></html>

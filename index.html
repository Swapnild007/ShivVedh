<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211813"><meta name="description" content="शिववेध: छत्रपती शिवाजी महाराज आणि स्वराज्याच्या इतिहासाचा स्रोतसमीक्षात्मक मराठी डिजिटल ग्रंथ."><title>शिववेध | स्वराज्याचा डिजिटल ग्रंथ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#422b20;--gold:#c79b59;--paper:#f4e7ca;--size:19px}*{box-sizing:border-box}body{margin:0;background:#1c1410;color:var(--ink);font-family:"Noto Serif Devanagari",serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #dcab62;outline-offset:3px}[hidden]{display:none!important}.app{width:min(100%,580px);min-height:100dvh;margin:auto;box-shadow:0 0 45px #0008}.cover{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:radial-gradient(ellipse at 50% 40%,#543624 0%,#251a15 56%,#110f0e 100%)}.book-cover{width:100%;min-height:min(790px,calc(100dvh - 48px));border:2px solid #9b703d;outline:1px solid #7b572f;outline-offset:-12px;box-shadow:inset 0 0 0 6px #251910,inset 0 0 0 8px #886139,12px 15px 22px #0009;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:36px 19px;color:#f0d3a1;position:relative;background:radial-gradient(ellipse at center,#48301f,#1b1614 75%)}.book-cover:before,.book-cover:after{content:"◆  ✦  ◆";font-size:15px;color:#b98a4f;letter-spacing:9px}.book-cover:before{margin-bottom:25px}.book-cover:after{margin-top:24px}.volume{font-size:12px;letter-spacing:.08em;color:#c7a36c}.logo{width:100%;display:block;box-shadow:0 8px 30px #0006;margin:22px 0 10px}.book-cover h1{font-size:clamp(20px,5vw,27px);line-height:1.7;font-weight:600;margin:12px 0;color:#f1d8aa}.subtitle{font-size:13px;line-height:1.9;color:#c4a984;margin:0 0 23px}.enter{border:1px solid #e6bf7b;background:linear-gradient(135deg,#e6bf7b,#9b6833);padding:15px 25px;color:#26180e;font-weight:800;min-height:54px;border-radius:3px;width:min(100%,310px)}.book-cover footer{font-size:11px;color:#bca078;margin-top:18px}.reader{min-height:100dvh;background:#b9a17b;padding-bottom:calc(84px + env(safe-area-inset-bottom))}.toolbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;background:#291c15;color:#f1d4a1;border-bottom:2px solid #9c743f;padding:11px 15px;min-height:64px}.toolbar strong{font-size:21px}.tool{border:1px solid #806341;background:transparent;color:inherit;border-radius:5px;min-width:46px;min-height:44px;font-size:18px}.page{position:relative;margin:14px 12px 28px;min-height:calc(100dvh - 185px);padding:42px 29px 65px;background:linear-gradient(90deg,#e2cda7 0%,#f8edd5 5%,#f8eed8 94%,#dfc69e 100%);box-shadow:inset 7px 0 15px #76502b29,3px 3px #d2b789,6px 6px #b89968,0 14px 25px #39271e66}.page:before{content:"";position:absolute;inset:14px;border:1px solid #c1a06d;pointer-events:none}.page:after{content:"❦";display:block;text-align:center;color:#a5824d;font-size:22px;margin-top:36px}.folio{text-align:center;font-size:12px;color:#926b3e;letter-spacing:.07em;margin:0 0 26px}.page h2{text-align:center;font-size:clamp(26px,6.4vw,37px);line-height:1.55;color:#5b3824;margin:0 0 8px}.rule{text-align:center;color:#aa854c;font-size:25px;margin:8px 0 24px}.prose p{font-size:var(--size);line-height:1.95;margin:0 0 20px;text-align:left;overflow-wrap:break-word}.prose p:first-child:first-letter{font-size:1.6em;font-weight:700;color:#8d4e2d}.notice{font-size:12px;line-height:1.85;color:#765b41;border-top:1px solid #c6a77a;margin-top:30px;padding-top:16px}.source{font-size:12px;line-height:1.8;margin-top:14px}.source a{color:#764820}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,580px);display:flex;justify-content:space-around;align-items:center;z-index:4;background:#291b14;color:#f2d8ad;border-top:2px solid #9e7646;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:inherit;min-height:46px;font-size:13px;font-weight:700;padding:6px}.nav button:disabled{opacity:.35}.overlay{position:fixed;inset:0;z-index:9;background:#0c0908bc;display:flex;justify-content:center}.panel{width:min(100%,580px);height:100%;overflow-y:auto;background:#f4e7cb;color:#432c20;padding:25px 22px 50px}.panelhead{display:flex;justify-content:space-between;align-items:center}.panel h2{font-size:25px;margin:0 0 14px}.panel input{width:100%;padding:12px;border:1px solid #b89b72;background:#fff7e8;font-size:16px;border-radius:3px;margin:12px 0}.chapter{display:block;width:100%;text-align:left;padding:17px 8px;border:0;border-bottom:1px solid #d4bb95;background:transparent;color:#3c2a20;font-size:17px}.chapter[aria-current=page]{background:#e5d1ad;font-weight:800}.chapter small{display:block;color:#876c4f;font-size:11px;margin-top:5px}.settings{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0}.settings button{padding:8px 18px;border:1px solid #ad8857;background:#f7ecd5;color:#402a1c}.meta{font-size:12px;color:#7e6346;text-align:center}@media(max-width:370px){.page{padding:40px 23px 55px}.prose p{line-height:1.85}.book-cover{padding:25px 17px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main class="app"><section class="cover" id="cover"><div class="book-cover"><div class="volume">॥ श्री ॥ &nbsp; खंड प्रथम &nbsp; ॥ श्री ॥</div><img class="logo" src="assets/shivvedh-logo.png.png" alt="शिववेध अधिकृत राजमुद्रा आणि भगवे ध्वज"><h1>स्वराज्याच्या इतिहासाचा<br>संदर्भाधारित अभ्यास</h1><p class="subtitle">इतिहास • साधनचिकित्सा • अभ्यास</p><button class="enter" id="enter">ग्रंथ उघडा &nbsp; ❯</button><footer>संशोधनाधीन डिजिटल अभ्यास आवृत्ती</footer></div></section><section class="reader" id="reader" hidden><header class="toolbar"><button class="tool" id="menu" aria-label="अनुक्रमणिका उघडा">☰</button><strong>शिववेध</strong><button class="tool" id="home" aria-label="मुखपृष्ठ">⌂</button></header><article class="page" id="page" aria-live="polite"></article><nav class="nav" aria-label="पानांची दिशा"><button id="prev">← मागील</button><button id="contents">☷ अनुक्रमणिका</button><button id="next">पुढील →</button></nav></section></main><aside class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="अनुक्रमणिका" hidden><div class="panel"><div class="panelhead"><h2>अनुक्रमणिका</h2><button class="tool" id="close" aria-label="बंद करा">✕</button></div><p class="meta">खंड प्रथम • अभ्यास आवृत्ती</p><input id="search" type="search" placeholder="पान किंवा विषय शोधा…" aria-label="अनुक्रमणिकेत शोधा"><div class="settings"><button id="smaller" aria-label="अक्षर लहान करा">अ−</button><span>अक्षर आकार</span><button id="larger" aria-label="अक्षर मोठे करा">अ+</button></div><div id="chapters"></div></div></aside><script>
"use strict";
const chapters=[
{title:"शीर्षकपृष्ठ",type:"प्रारंभिक पृष्ठ",paragraphs:["शिववेध हा छत्रपती शिवाजी महाराज आणि स्वराज्याच्या इतिहासाचा चिकित्सक अभ्यास करण्यासाठी उभारला जात असलेला मराठी डिजिटल ग्रंथ आहे.","खंड प्रथम ही संशोधनाधीन अभ्यास आवृत्ती आहे. ऐतिहासिक घटनांचे कथन आणि त्या घटनांबाबत उपलब्ध पुराव्यांची चर्चा हे दोन स्वतंत्र स्तर ठेवणे हा संपादकीय हेतू आहे."],note:"ही अभ्यास आवृत्ती आहे; पूर्ण संशोधित ग्रंथ म्हणून प्रस्तुत केलेली नाही."},
{title:"मनोगत",type:"प्रारंभिक पृष्ठ",paragraphs:["इतिहास हा केवळ घटनांचा क्रम नसतो. पत्रे, आज्ञापत्रे, शिलालेख, नाणी, प्रवासवर्णने आणि बखरी यांच्यामधून आपल्याला भूतकाळाचे विविध आवाज ऐकू येतात. त्या आवाजांतील साम्य आणि विसंगती तपासणे ही इतिहासलेखनाची जबाबदारी आहे.","शिववेधमध्ये आदर आणि चिकित्सक दृष्टी एकत्र ठेवण्याचा प्रयत्न आहे. एखादी कथा लोकप्रिय असणे आणि तिच्यासाठी समकालीन पुरावा उपलब्ध असणे या वेगळ्या गोष्टी आहेत."],note:"संपादकीय मनोगत; ऐतिहासिक निष्कर्ष नव्हे."},
{title:"प्रस्तावना",type:"प्रारंभिक पृष्ठ",paragraphs:["छत्रपती शिवाजी महाराजांचा अभ्यास करताना सतराव्या शतकातील दख्खनची राजकीय, सामाजिक आणि भौगोलिक पार्श्वभूमी महत्त्वाची ठरते. विविध सत्ताकेंद्रे, स्थानिक सरदार, व्यापारमार्ग आणि दुर्ग यांचा परस्परसंबंध लक्षात घेऊनच घटनांचा अर्थ लावावा लागतो.","या ग्रंथात शक्य तिथे प्राथमिक साधने, त्यांच्या तारखा आणि संपादित प्रकाशनांची स्पष्ट नोंद देण्याचे धोरण आहे. स्रोतांमध्ये मतभेद असतील तर ते लपवण्याऐवजी स्वतंत्रपणे मांडले जातील."],note:"प्रास्ताविक विवेचन; सविस्तर स्रोतसमीक्षा पुढील आवृत्तीत."},
{title:"इतिहासाची साधने",type:"अभ्यास विभाग",paragraphs:["इतिहासाच्या साधनांमध्ये समकालीन पत्रव्यवहार, प्रशासकीय नोंदी, फारसी व मराठी दस्तऐवज, शिलालेख, नाणी आणि परकीय प्रवाशांच्या नोंदी यांचा समावेश होतो. प्रत्येक साधनाचे स्वरूप आणि मर्यादा भिन्न असतात.","बखरींचे वाचन करताना त्या नेमक्या कधी लिहिल्या गेल्या, लेखकाला कोणत्या परंपरा उपलब्ध होत्या आणि नंतरच्या प्रतींमध्ये काय बदल झाले असावेत याचा विचार आवश्यक आहे.","एखाद्या घटनेबाबत स्वतंत्र साधनांमधून पुष्टी मिळाल्यास निष्कर्ष अधिक मजबूत होतो. मात्र एकाच मजकुराची पुनरावृत्ती वेगवेगळ्या ग्रंथांत झाली म्हणून ती स्वतंत्र पुष्टी ठरत नाही."],note:"स्रोतवाचनासाठी प्राथमिक मार्गदर्शक; विशिष्ट ऐतिहासिक दाव्यांची संदर्भसूची अद्याप तयार होत आहे."},
{title:"संदर्भ व संपादकीय धोरण",type:"संशोधन नोंद",paragraphs:["या ग्रंथातील ऐतिहासिक विधानांसाठी स्रोताचे शीर्षक, लेखक किंवा संपादक, आवृत्ती, संबंधित पृष्ठ आणि शक्य असल्यास मूळ दस्तऐवजाचा कालावधी नोंदवणे अपेक्षित आहे.","साहित्यिक पुनर्रचना आणि ऐतिहासिक पुराव्यांवर आधारित निवेदन यांची स्पष्ट विभागणी केली जाईल. संवाद किंवा प्रसंगाची कल्पनारम्य रचना तथ्य म्हणून मांडली जाणार नाही.","सध्या उपलब्ध पाने ही ग्रंथाची संपादकीय पायाभरणी आहेत. सविस्तर कालरेषा, दुर्गविषयक लेखन, व्यक्तिचित्रे आणि संदर्भग्रंथसूची पडताळणीनंतरच प्रकाशित केली जातील."],note:"अपूर्ण संशोधनाला पूर्ण इतिहास म्हणून दाखवलेले नाही."}
];
const $=id=>document.getElementById(id);let current=0,size=19,returnFocus=null;try{const n=Number(localStorage.getItem("shivvedh-v2-page"));if(Number.isInteger(n)&&n>=0&&n<chapters.length)current=n;const z=Number(localStorage.getItem("shivvedh-v2-size"));if(z>=16&&z<=24)size=z}catch(e){}
function render(){const d=chapters[current],page=$("page");page.replaceChildren();const folio=document.createElement("div");folio.className="folio";folio.textContent="॥ "+d.type+" · "+String(current+1).padStart(2,"0")+" ॥";const title=document.createElement("h2");title.textContent=d.title;const ornament=document.createElement("div");ornament.className="rule";ornament.textContent="❦";const prose=document.createElement("div");prose.className="prose";for(const line of d.paragraphs){const p=document.createElement("p");p.textContent=line;prose.append(p)}const note=document.createElement("div");note.className="notice";note.textContent="संपादकीय नोंद : "+d.note;page.append(folio,title,ornament,prose,note);$("prev").disabled=current===0;$("next").disabled=current===chapters.length-1;document.documentElement.style.setProperty("--size",size+"px");try{localStorage.setItem("shivvedh-v2-page",current);localStorage.setItem("shivvedh-v2-size",size)}catch(e){}window.scrollTo({top:0,behavior:"instant"})}
function enter(){$("cover").hidden=true;$("reader").hidden=false;render()}function openContents(){returnFocus=document.activeElement;$("overlay").hidden=false;list();$("close").focus()}function closeContents(){$("overlay").hidden=true;if(returnFocus&&returnFocus.focus)returnFocus.focus()}function list(){const query=$("search").value.trim().toLocaleLowerCase("mr");$("chapters").replaceChildren();chapters.forEach((d,i)=>{if(!(d.title+" "+d.type).toLocaleLowerCase("mr").includes(query))return;const b=document.createElement("button");b.className="chapter";b.setAttribute("aria-current",i===current?"page":"false");b.textContent=String(i+1).padStart(2,"0")+"  "+d.title;const sub=document.createElement("small");sub.textContent=d.type;b.append(sub);b.addEventListener("click",()=>{current=i;closeContents();enter()});$("chapters").append(b)})}
$("enter").addEventListener("click",enter);$("home").addEventListener("click",()=>{$("reader").hidden=true;$("cover").hidden=false;window.scrollTo(0,0)});$("menu").addEventListener("click",openContents);$("contents").addEventListener("click",openContents);$("close").addEventListener("click",closeContents);$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeContents()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeContents()});$("search").addEventListener("input",list);$("prev").addEventListener("click",()=>{if(current>0){current--;render()}});$("next").addEventListener("click",()=>{if(current<chapters.length-1){current++;render()}});$("smaller").addEventListener("click",()=>{size=Math.max(16,size-1);render()});$("larger").addEventListener("click",()=>{size=Math.min(24,size+1);render()});
</script></body></html>

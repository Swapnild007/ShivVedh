name: ShivVedh release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify book, archives, source links and offline shell
        run: python scripts/check_release.py

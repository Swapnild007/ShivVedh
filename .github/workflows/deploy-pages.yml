name: Publish ShivVedh to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Require approved release
        env:
          RELEASE_APPROVED: ${{ vars.SHIVVEDH_RELEASE_APPROVED }}
        run: |
          if [ "$RELEASE_APPROVED" != "true" ]; then
            echo 'Release blocked: set SHIVVEDH_RELEASE_APPROVED=true only after review.'
            exit 1
          fi
      - name: Validate website files
        run: |
          test -f index.html
          test -f offline.html
          test -f sw.js
          python3 scripts/check_release.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

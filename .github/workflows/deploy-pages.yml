name: Publish ShivVedh to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require approved release
        env:
          RELEASE_APPROVED: ${{ vars.SHIVVEDH_RELEASE_APPROVED }}
        run: |
          if [ "$RELEASE_APPROVED" != "true" ]; then
            echo 'Release blocked: set SHIVVEDH_RELEASE_APPROVED=true only after review.'
            exit 1
          fi
      - name: Validate website files
        run: |
          test -f index.html
          test -f offline.html
          test -f sw.js
          python3 scripts/check_release.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
